openapi: 3.0.0

info:
  title: API de estoques
  version: 1.1.0
  description: API para gerenciamento de estoques, produtos, categorias e vendas.

servers:
  - url: http://localhost:3000
    description: Servidor local

tags:
  - name: Produtos
  - name: Categorias
  - name: estoques
  - name: Vendas

paths:

  /produtos:
    get:
      tags: [Produtos]
      summary: Lista todos os produtos
      responses:
        '200':
          description: Lista de produtos retornada
          content:
            application/json:
              example:
                - __id: "693afda0f6437add7f9646p1"
                  nome: "Arroz 5kg"
                  id_categoria: "693afda0f6437add7f9646c1"
                  preco: 24.90
                  descricao: "Arroz tipo 1"
                - _id: "693afda0f6437add7f9646p2"
                  nome: "Feijão Preto"
                  id_categoria: "693afda0f6437add7f9646c1"
                  preco: 8.50
                  descricao: "Feijão selecionado"

    post:
      tags: [Produtos]
      summary: Cadastra um novo produto
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Produto'
            example:
              nome: "Macarrão"
              id_categoria: "693afda0f6437add7f9646c2"
              preco: 4.50
              descricao: "Macarrão espaguete"
      responses:
        '201':
          description: Produto criado
          content:
            application/json:
              example:
                _id: "693afda0f6437add7f9646p3"
                nome: "Macarrão"
                id_categoria: "693afda0f6437add7f9646c2"
                preco: 4.50
                descricao: "Macarrão espaguete"

  /produtos/{id}:
    get:
      tags: [Produtos]
      summary: Busca produto pelo ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Produto encontrado
          content:
            application/json:
              example:
                _id: "693afda0f6437add7f9646p1"
                nome: "Arroz 5kg"
                id_categoria: "693afda0f6437add7f9646c1"
                preco: 24.90
                descricao: "Arroz tipo 1"
        '404':
          description: Produto não encontrado

    put:
      tags: [Produtos]
      summary: Atualiza um produto
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Produto' }
            example:
              nome: "Arroz Premium 5kg"
              id_categoria: "693afda0f6437add7f9646c1"
              preco: 29.90
              descricao: "Arroz melhorado"
      responses:
        '200':
          description: Produto atualizado
          content:
            application/json:
              example:
                _id: "693afda0f6437add7f9646p1"
                nome: "Arroz Premium 5kg"
                id_categoria: "693afda0f6437add7f9646c1"
                preco: 29.90

    delete:
      tags: [Produtos]
      summary: Remove produto
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Produto removido

  /produtos/categoria/{id_categoria}:
    get:
      tags: [Produtos]
      summary: Lista produtos por categoria
      parameters:
        - in: path
          name: id_categoria
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Lista retornada
          content:
            application/json:
              example:
                - _id: "693afda0f6437add7f9646p1"
                  nome: "Arroz 5kg"
                  id_categoria: "693afda0f6437add7f9646c1"
                  preco: 24.90

  /categorias:
    get:
      tags: [Categorias]
      summary: Lista categorias
      responses:
        '200':
          description: Categorias retornadas
          content:
            application/json:
              example:
                - _id: "693afda0f6437add7f9646c1"
                  nome: "Alimentos"
                - _id: "693afda0f6437add7f9646c2"
                  nome: "Higiene"

    post:
      tags: [Categorias]
      summary: Cria categoria
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Categoria' }
            example:
              nome: "Bebidas"
      responses:
        '201':
          description: Categoria criada
          content:
            application/json:
              example:
                _id: "693afda0f6437add7f9646c3"
                nome: "Bebidas"

  /categorias/{id}:
    get:
      tags: [Categorias]
      summary: Busca categoria
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Categoria encontrada
          content:
            application/json:
              example:
                _id: "693afda0f6437add7f9646c1"
                nome: "Alimentos"

    put:
      tags: [Categorias]
      summary: Atualiza categoria
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Categoria' }
            example:
              nome: "Alimentos Secos"
      responses:
        '200':
          description: Categoria atualizada

    delete:
      tags: [Categorias]
      summary: Remove categoria
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Categoria removida
  /estoques:
    get:
      tags: [estoques]
      summary: Lista estoques de todos os produtos
      responses:
        '200':
          description: estoques retornado
          content:
            application/json:
              example:
                - idProduto: "693afda0f6437add7f9646p1"
                  quantidade: 150
                - idProduto: "693afda0f6437add7f9646p2"
                  quantidade: 44

  /estoques/{idProduto}:
    get:
      tags: [estoques]
      summary: Consulta estoques de um produto
      parameters:
        - in: path
          name: idProduto
          required: true
          schema:
            type: string
      responses:
        '200':
          description: estoques encontrado
          content:
            application/json:
              example:
                idProduto: "693afda0f6437add7f9646p1"
                quantidade: 150

  /estoques/movimentar:
    post:
      tags: [estoques]
      summary: Movimenta estoques
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Movimentoestoques' }
            example:
              idProduto: "693afda0f6437add7f9646p1"
              tipo: "entrada"
              quantidade: 20
      responses:
        '200':
          description: Movimento registrado
          content:
            application/json:
              example:
                idProduto: "693afda0f6437add7f9646p1"
                quantidade: 20
                data: "2025-02-01"
  /vendas:
    get:
      tags: [Vendas]
      summary: Lista vendas realizadas
      responses:
        '200':
          description: Lista de vendas
          content:
            application/json:
              example:
                - _id: "693afda0f6437add7f9646v1"
                  data: "2025-01-20"
                  total: 120.50
                  itens:
                    - idProduto: "693afda0f6437add7f964612"
                      quantidade: 2
                      precoUnitario: 24.90

    post:
      tags: [Vendas]
      summary: Registra nova venda
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Venda' }
            example:
              itens:
                - idProduto: "693afda0f6437add7f964613"
                  quantidade: 2
                - idProduto: "693afda0f6437add7f964617"
                  quantidade: 1
      responses:
        '201':
          description: Venda registrada
          content:
            application/json:
              example:
                _id: "693afda0f6437add7f964610"
                total: 58.30
                data: "2025-02-01"

  /vendas/{id}:
    get:
      tags: [Vendas]
      summary: Busca venda pelo ID
      parameters:
        - in: path
          name: id
          required: true
      responses:
        '200':
          description: Venda retornada
          content:
            application/json:
              example:
                _id: "v1"
                total: 120.50
                data: "2025-01-20"
                itens:
                  - idProduto: "693afda0f6437add7f964613"
                    quantidade: 2
                    precoUnitario: 24.90
        '404':
          description: Venda não encontrada
components:
  schemas:

    Produto:
      type: object
      properties:
        nome: { type: string }
        id_categoria: { type: string }
        preco: { type: number }
        descricao: { type: string }
      required: [nome, id_categoria]

    Categoria:
      type: object
      properties:
        nome: { type: string }
      required: [nome]

    Movimentoestoques:
      type: object
      properties:
        idProduto: { type: string }
        quantidade: { type: integer }
      required: [idProduto, quantidade]

    Venda:
      type: object
      properties:
        itens:
          type: array
          items:
            type: object
            properties:
              idProduto: { type: string }
              quantidade: { type: integer }
      required: [itens]
