openapi: 3.0.0

info:
  title: API de estoques
  version: 1.1.0
  description: API para gerenciamento de estoques, produtos, categorias e vendas.

servers:
  - url: http://localhost:3000
    description: Servidor local

tags:
  - name: Produtos
  - name: Categorias
  - name: Estoques
  - name: Vendas

paths:

  /produtos:
    get:
      tags: [Produtos]
      summary: Lista todos os produtos
      responses:
        '200':
          description: Lista de produtos retornada
          content:
            application/json:
              example:
                - __id: "693afda0f6437add7f9646p1"
                  nome: "Arroz 5kg"
                  id_categoria: "693afda0f6437add7f9646c1"
                  preco: 24.90
                  descricao: "Arroz tipo 1"
                - _id: "693afda0f6437add7f9646p2"
                  nome: "Feijão Preto"
                  id_categoria: "693afda0f6437add7f9646c1"
                  preco: 8.50
                  descricao: "Feijão selecionado"

    post:
      tags: [Produtos]
      summary: Cadastra um novo produto
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Produto'
            example:
              nome: "Macarrão"
              id_categoria: "693afda0f6437add7f9646c2"
              preco: 4.50
              descricao: "Macarrão espaguete"
      responses:
        '201':
          description: Produto criado
          content:
            application/json:
              example:
                _id: "693afda0f6437add7f9646p3"
                nome: "Macarrão"
                id_categoria: "693afda0f6437add7f9646c2"
                preco: 4.50
                descricao: "Macarrão espaguete"

  /produtos/{id}:
    get:
      tags: [Produtos]
      summary: Busca produto pelo ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Produto encontrado
          content:
            application/json:
              example:
                _id: "693afda0f6437add7f9646p1"
                nome: "Arroz 5kg"
                id_categoria: "693afda0f6437add7f9646c1"
                preco: 24.90
                descricao: "Arroz tipo 1"
        '404':
          description: Produto não encontrado

    put:
      tags: [Produtos]
      summary: Atualiza um produto
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Produto' }
            example:
              nome: "Arroz Premium 5kg"
              id_categoria: "693afda0f6437add7f9646c1"
              preco: 29.90
              descricao: "Arroz melhorado"
      responses:
        '200':
          description: Produto atualizado
          content:
            application/json:
              example:
                _id: "693afda0f6437add7f9646p1"
                nome: "Arroz Premium 5kg"
                id_categoria: "693afda0f6437add7f9646c1"
                preco: 29.90

    delete:
      tags: [Produtos]
      summary: Remove produto
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Produto removido

  /produtos/categoria/{id_categoria}:
    get:
      tags: [Produtos]
      summary: Lista produtos por categoria
      parameters:
        - in: path
          name: id_categoria
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Lista retornada
          content:
            application/json:
              example:
                - _id: "693afda0f6437add7f9646p1"
                  nome: "Arroz 5kg"
                  id_categoria: "693afda0f6437add7f9646c1"
                  preco: 24.90

  /categorias:
    get:
      tags: [Categorias]
      summary: Lista categorias
      responses:
        '200':
          description: Categorias retornadas
          content:
            application/json:
              example:
                - _id: "693afda0f6437add7f9646c1"
                  nome: "Alimentos"
                - _id: "693afda0f6437add7f9646c2"
                  nome: "Higiene"

    post:
      tags: [Categorias]
      summary: Cria categoria
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Categoria' }
            example:
              nome: "Bebidas"
      responses:
        '201':
          description: Categoria criada
          content:
            application/json:
              example:
                _id: "693afda0f6437add7f9646c3"
                nome: "Bebidas"

  /categorias/{id}:
    get:
      tags: [Categorias]
      summary: Busca categoria
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Categoria encontrada
          content:
            application/json:
              example:
                _id: "693afda0f6437add7f9646c1"
                nome: "Alimentos"

    put:
      tags: [Categorias]
      summary: Atualiza categoria
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Categoria' }
            example:
              nome: "Alimentos Secos"
      responses:
        '200':
          description: Categoria atualizada

    delete:
      tags: [Categorias]
      summary: Remove categoria
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Categoria removida
  /estoques:
    get:
      tags: [Estoques]
      summary: Lista estoques de todos os produtos
      responses:
        '200':
          description: Estoques retornados
          content:
            application/json:
              example:
                - id_produto: "693afda0f6437add7f9646p1"
                  quantidade: 150
                - id_produto: "693afda0f6437add7f9646p2"
                  quantidade: 44

  /estoques/{id_produto}:
    get:
      tags: [Estoques]
      summary: Consulta estoques de um produto
      parameters:
        - in: path
          name: id_produto
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Estoques encontrados
          content:
            application/json:
              example:
                id_produto: "693afda0f6437add7f9646p1"
                quantidade: 150

  /estoques/movimentar:
    post:
      tags: [Estoques]
      summary: Movimenta estoques
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Movimentoestoques' }
            example:
              id_produto: "693afda0f6437add7f9646p1"
              tipo: "entrada"
              quantidade: 20
      responses:
        '200':
          description: Movimento registrado
          content:
            application/json:
              example:
                _id: "693afda0f6437add7f9646m1"
                id_produto: "693afda0f6437add7f9646p1"
                quantidade: 20
  /vendas:
    get:
      tags: [Vendas]
      summary: Lista vendas realizadas
      responses:
        '200':
          description: Lista de vendas
          content:
            application/json:
              example:
                - _id: "693afda0f6437add7f9646v1"
                  data: "2025-01-20"
                  total: 120.50
                  itens:
                    - id_produto: "693afda0f6437add7f964612"
                      quantidade: 2
                      precoUnitario: 24.90

    post:
      tags: [Vendas]
      summary: Registra nova venda
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Venda' }
            example:
              itens:
                - id_produto: "696ef3581781c8232b84ff9f"
                  quantidade: 1
                - id_produto: "696ef497503922700f59db5a"
                  quantidade: 2
      responses:
        '201':
          description: Venda registrada
          content:
            application/json:
              example:
                  "_id": "696fd309641409858f11fcc3"
                  "data": "2026-01-20T19:10:01.545Z"
                  "total": 16
                  "itens":
                       - "id_produto": "696ef3581781c8232b84ff9f"
                         "quantidade": 1
                         "preco_unitario": 6
                       - "id_produto": "696ef497503922700f59db5a"
                         "quantidade": 2
                         "preco_unitario": 5
  /vendas/{id}:
    get:
      tags: [Vendas]
      summary: Busca venda pelo ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Venda retornada
          content:
            application/json:
              example:
                _id: "v1"
                total: 120.50
                data: "2025-01-20"
                itens:
                  - id_produto: "693afda0f6437add7f964613"
                    quantidade: 2
                    precoUnitario: 24.90
        '404':
          description: Venda não encontrada

    put:
      tags: [Vendas]
      summary: Atualiza venda
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [itens]
              properties:
                itens:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [id_produto, quantidade]
                    properties:
                      id_produto:
                        type: string
                      quantidade:
                        type: number
                        minimum: 1
            example:
              itens:
                - id_produto: "696ef3581781c8232b84ff9f"
                  quantidade: 1
                - id_produto: "696ef497503922700f59db5a"
                  quantidade: 2
      responses:
        '200':
          description: Venda atualizada com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  _id:
                    type: string
                  data:
                    type: string
                    format: date-time
                  total:
                    type: number
                  itens:
                    type: array
                    items:
                      type: object
                      properties:
                        id_produto:
                          type: string
                        quantidade:
                          type: number
                        preco_unitario:
                          type: number
              example:
                _id: "696fd309641409858f11fcc3"
                data: "2026-01-20T19:10:01.545Z"
                total: 16
                itens:
                  - id_produto: "696ef3581781c8232b84ff9f"
                    quantidade: 1
                    preco_unitario: 6
                  - id_produto: "696ef497503922700f59db5a"
                    quantidade: 2
                    preco_unitario: 5
        '400':
          description: Erro de validação (ID ou itens inválidos)
        '404':
          description: Venda não encontrada
        '500':
          description: Erro interno do servidor

    delete:
      tags: [Vendas]
      summary: Remove venda
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Venda deletada com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
              example:
                message: "Venda deletada com sucesso"
        '400':
          description: ID não fornecido
          content:
            application/json:
              example:
                error: "ID não fornecido"
        '404':
          description: Venda não encontrada
          content:
            application/json:
              example:
                error: "Venda não encontrada"
        '500':
          description: Erro interno do servidor

components:
  schemas:

    Produto:
      type: object
      properties:
        nome: { type: string }
        id_categoria: { type: string }
        preco: { type: number }
        descricao: { type: string }
      required: [nome, id_categoria]

    Categoria:
      type: object
      properties:
        nome: { type: string }
      required: [nome]

    Estoque:
      type: object
      properties:
        id_produto: { type: string }
        quantidade: { type: integer }
      required: [id_produto, quantidade]

    Venda:
      type: object
      properties:
        itens:
          type: array
          items:
            type: object
            properties:
              id_produto: { type: string }
              quantidade: { type: integer }
      required: [itens]
